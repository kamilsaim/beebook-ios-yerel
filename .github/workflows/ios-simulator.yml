# BeeBook iOS — simülatörde derle, örnek veriyle aç, her sekmenin ekran görüntüsünü al.
# İmza/sertifika gerekmez. YALNIZ ELLE (macOS dakikası kıt):
#   gh workflow run ios-simulator.yml -R kamilsaim/beebook-ios-yerel
# Görüntüler "ekran-goruntuleri" artefaktında (1179×2556 civarı, iPhone Pro).
name: iOS - Simulator

on:
  workflow_dispatch:
    inputs:
      ekranlar:
        description: "Boşlukla ayrılmış -sekme değerleri"
        required: false
        default: "anaSayfa kovanlar anaAri satis daha"

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Xcode seç (en yeni kararlı)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Xcode projesini üret (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Simülatörü seç ve başlat
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[x for k,v in d.items() if "iOS" in k for x in v if "iPhone" in x["name"] and "Pro" in x["name"] and "Max" not in x["name"]]
          c.sort(key=lambda x:x["name"])
          print(c[-1]["udid"])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryLevel 100 --cellularBars 4 --wifiBars 3

      - name: Simülatör için derle
        run: |
          set -o pipefail
          xcodebuild -project Arici.xcodeproj -scheme Arici -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee derleme.log | grep -E "error:|warning: .*Arici|BUILD" || true
          test -d build/Build/Products/Debug-iphonesimulator/Arici.app

      - name: Kur, aç, ekran görüntüsü al
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          EKRANLAR: ${{ inputs.ekranlar }}
        run: |
          mkdir -p goruntuler
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Arici.app
          for E in $EKRANLAR; do
            xcrun simctl terminate "$UDID" com.kamilsaim.arici || true
            xcrun simctl launch "$UDID" com.kamilsaim.arici -ornekVeri -sekme "$E"
            sleep 6
            xcrun simctl io "$UDID" screenshot "goruntuler/$E.png"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ekran-goruntuleri
          path: |
            goruntuler
            derleme.log
