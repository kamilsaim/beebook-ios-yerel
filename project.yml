# BeeBook iOS (yerel SwiftUI) — XcodeGen proje tanımı.
# Xcode projesi elle tutulmaz; bulut Mac'te `xcodegen generate` ile üretilir.
name: Arici
options:
  bundleIdPrefix: com.kamilsaim
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: tr
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: NBTXFU47EV
packages:
  AriCekirdek:
    path: Paketler/AriCekirdek
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0
targets:
  Arici:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: Arici
        excludes:
          - "**/OFL-*.txt"
          - Info.plist
          - Arici.entitlements
    dependencies:
      - package: AriCekirdek
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kamilsaim.arici
        PRODUCT_NAME: Arici
        MARKETING_VERSION: "3.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_ENTITLEMENTS: Arici/Arici.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Yerel Google girişi: Google Cloud'da (proje kamilsaim) com.kamilsaim.arici iOS istemcisi
        # açılınca doldurulur. Boşken uygulama tarayıcı girişine düşer.
        GOOGLE_IOS_ISTEMCI: ""
        GOOGLE_WEB_ISTEMCI: 981361653395-29bu0kvshm6l4p149u5vo0g5lkaqihus.apps.googleusercontent.com
        GOOGLE_IOS_URL_SEMASI: com.kamilsaim.arici.google
    info:
      path: Arici/Info.plist
      properties:
        CFBundleDisplayName: BeeBook
        CFBundleDevelopmentRegion: tr
        CFBundleLocalizations: [tr]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIAppFonts:
          - Nunito-Regular.ttf
          - Nunito-Medium.ttf
          - Nunito-SemiBold.ttf
          - Nunito-Bold.ttf
          - CormorantGaramond-Bold.ttf
        UILaunchScreen:
          UIColorName: Orman
          UIImageName: Acilis
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSCameraUsageDescription: Kovan plakasındaki barkodu okumak ve ürün fotoğrafı çekmek için kamera kullanılır.
        NSPhotoLibraryUsageDescription: Ürün görseli seçmek için fotoğraflarına erişilir.
        GIDClientID: $(GOOGLE_IOS_ISTEMCI)
        GIDServerClientID: $(GOOGLE_WEB_ISTEMCI)
        CFBundleURLTypes:
          - CFBundleURLName: com.kamilsaim.arici
            CFBundleURLSchemes: [com.kamilsaim.arici]
          - CFBundleURLName: google
            CFBundleURLSchemes: [$(GOOGLE_IOS_URL_SEMASI)]
